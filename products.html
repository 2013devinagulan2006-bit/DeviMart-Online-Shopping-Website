<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devi Mart - Products</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
    }

    nav {
        background: linear-gradient(135deg, #ff4f9a, #ff1493);
        padding: 18px 40px;
        display: flex;
        align-items: center;
        gap: 25px;
        flex-wrap: wrap;
    }

    .logo {
        color: white;
        font-size: 28px;
        font-weight: bold;
    }

    .search {
        flex: 1;
        max-width: 500px;
    }

    .search input {
        width: 100%;
        padding: 13px 18px;
        border: none;
        border-radius: 25px;
        outline: none;
        font-size: 15px;
    }

    .nav-links {
        display: flex;
        gap: 20px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .container {
        width: 92%;
        max-width: 1300px;
        margin: 35px auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 35px;
    }

    .category-title {
        color: #ff1493;
        margin: 35px 0 20px;
        padding-left: 12px;
        border-left: 5px solid #ff1493;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 25px;
    }

    .product-card {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        transition: 0.3s;
        cursor: pointer;
    }

    .product-card:hover {
        transform: translateY(-5px);
    }

    .product-image {
        width: 100%;
        height: 220px;
        object-fit: contain;
        padding: 15px;
        background: white;
    }

    .product-info {
        padding: 18px;
    }

    .product-name {
        font-size: 18px;
        font-weight: bold;
        min-height: 45px;
    }

    .price {
        color: #e91e63;
        font-size: 20px;
        font-weight: bold;
        margin: 12px 0;
    }

    .buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .buttons button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    .cart-btn {
        background: #ff1493;
        color: white;
    }

    .wishlist-btn {
        background: #fff0f6;
        color: #e91e63;
        border: 1px solid #e91e63 !important;
    }

    .buy-btn {
        background: #ff9800;
        color: white;
    }

    .cart-btn:hover {
        background: #d90072;
    }

    .wishlist-btn:hover {
        background: #ffd9e9;
    }

    .buy-btn:hover {
        background: #e68900;
    }

    .no-result {
        text-align: center;
        font-size: 20px;
        color: #777;
        padding: 50px 20px;
    }

    footer {
        margin-top: 50px;
        padding: 25px;
        background: #222;
        color: white;
        text-align: center;
    }
</style>

</head>

<body>

<nav>

    <div class="logo">
        Devi Mart
    </div>

    <div class="search">

        <input
            type="text"
            id="searchBox"
            placeholder="Search products..."
        >

    </div>

    <div class="nav-links">

        <a href="home.html">
            Home
        </a>

        <a href="wishlist.html">
            ♡ Wishlist
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

</nav>

    <h2 class="category-title" id="flowersTitle">
        🌸 Flowers
    </h2>

    <div class="products" id="flowers"></div>


    <div class="no-result" id="noResult" style="display:none;">
        No products found.

<footer>

    <p>
        © 2026 Devi Mart. All Rights Reserved.

    }

];


let products = JSON.parse(localStorage.getItem("products"));


if (!products || products.length === 0) {

    products = defaultProducts;

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

}


/* Get search and category from URL */

const urlParams = new URLSearchParams(
    window.location.search
);

const searchText =
    (urlParams.get("search") || "")
    .trim()
    .toLowerCase();

const selectedCategory =
    (urlParams.get("category") || "")
    .trim()
    .toLowerCase();


/* Put search text inside Products page search box */

document.getElementById("searchBox").value =
    urlParams.get("search") || "";


/* Display products */

function displayProducts() {

    document.getElementById("chocolates").innerHTML = "";
    document.getElementById("electronics").innerHTML = "";
    document.getElementById("flowers").innerHTML = "";

    let filteredProducts = products;


    /* Search filter */

    if (searchText !== "") {

        filteredProducts = filteredProducts.filter(function(product) {

            return product.name
                .toLowerCase()
                .includes(searchText);

        });

    }


    /* Category filter */

    if (selectedCategory !== "") {

        filteredProducts = filteredProducts.filter(function(product) {

            return product.category.toLowerCase() === selectedCategory;

        });

    }


    /* No result */

    if (filteredProducts.length === 0) {

        document.getElementById("noResult").style.display = "block";

    } else {

        document.getElementById("noResult").style.display = "none";

    }


    /* Change page title */

    if (searchText !== "") {

        document.getElementById("pageTitle").textContent =
            "Search Results for: " + urlParams.get("search");

    } else if (selectedCategory !== "") {

        document.getElementById("pageTitle").textContent =
            selectedCategory.charAt(0).toUpperCase() +
            selectedCategory.slice(1) +
            " Products";

    } else {

        document.getElementById("pageTitle").textContent =
            "All Products";

    }


    /* Hide category headings when searching */

    if (searchText !== "") {

        document.getElementById("chocolateTitle").style.display = "none";
        document.getElementById("electronicsTitle").style.display = "none";
        document.getElementById("flowersTitle").style.display = "none";

    }


    filteredProducts.forEach(function(product) {

        const card = document.createElement("div");

        card.className = "product-card";

        card.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                </div>

                <div class="buttons">

                    <button class="cart-btn">
                        🛒 Add to Cart
                    </button>

                    <button class="wishlist-btn">
                        ♡ Add to Wishlist
                    </button>

                    <button class="buy-btn">
                        Buy Now
                    </button>

                </div>

            </div>
        `;


        card.addEventListener("click", function() {

            localStorage.setItem(
                "selectedProduct",
                JSON.stringify(product)
            );

            window.location.href =
                "product-details.html";

        });


        card.querySelector(".cart-btn").addEventListener("click", function(event) {

            event.stopPropagation();

            const cartProduct = {

                name: product.name,

                price: Number(product.price),

                image: product.image,

                quantity: 1

            };

            localStorage.setItem(
                "cartProduct",
                JSON.stringify(cartProduct)
            );

            alert(
                product.name +
                " added to cart!"
            );

        });


        card.querySelector(".wishlist-btn").addEventListener("click", function(event) {

            event.stopPropagation();

            let wishlist =
                JSON.parse(
                    localStorage.getItem("wishlist")
                ) || [];


            let alreadyExists =
                wishlist.some(function(item) {

                    return item.name === product.name;

                });


            if (alreadyExists) {

                alert(
                    product.name +
                    " is already in your wishlist!"
                );

                return;

            }


            wishlist.push({

                name: product.name,

                price: Number(product.price),

                image: product.image

            });


            localStorage.setItem(
                "wishlist",
                JSON.stringify(wishlist)
            );


            alert(
                product.name +
                " added to wishlist!"
            );

        });


        card.querySelector(".buy-btn").addEventListener("click", function(event) {

            event.stopPropagation();

            localStorage.setItem(
                "selectedProduct",
                JSON.stringify(product)
            );

            window.location.href =
                "product-details.html";

        });


        const categoryContainer =
            document.getElementById(
                product.category
            );


        if (categoryContainer) {

            categoryContainer.appendChild(card);

        }

    });

}


displayProducts();


/* Products page search */

document.getElementById("searchBox")
.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {

        const value =
            this.value.trim();


        if (value === "") {

            window.location.href =
                "products.html";

        } else {

            window.location.href =
                "products.html?search=" +
                encodeURIComponent(value);

        }

    }

});

</script>
