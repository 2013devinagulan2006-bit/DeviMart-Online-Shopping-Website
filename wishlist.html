<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - Devi Mart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f8;
            color: #333;
        }

        nav {
            background: #ff4f87;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav h1 {
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .wishlist-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #ff4f87;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            background: #ff4f87;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 7px;
            cursor: pointer;
            margin: 5px;
        }

        .remove-btn {
            background: #555;
        }

        .empty {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .empty a {
            display: inline-block;
            margin-top: 20px;
            color: #ff4f87;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            nav {
                padding: 15px;
            }

            nav a {
                margin-left: 8px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h1>Devi Mart</h1>

        <div>
            <a href="home.html">Home</a>
            <a href="products.html">Products</a>
            <a href="wishlist.html">♡ Wishlist</a>
            <a href="cart.html">🛒 Cart</a>
            <a href="profile.html">Profile</a>
        </div>
    </nav>

    <div class="container">

        <h2>♡ My Wishlist</h2>

        <div id="wishlistContainer"></div>

    </div>

    <script>

        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

        let container = document.getElementById("wishlistContainer");

        if (wishlist.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    <h2>Your Wishlist is Empty</h2>
                    <p>Add products that you like to your wishlist.</p>

                    <a href="products.html">
                        ← Continue Shopping
                    </a>
                </div>
            `;

        } else {

            wishlist.forEach((product, index) => {

                container.innerHTML += `
                    <div class="product-card">

                        <img src="${product.image}"
                             alt="${product.name}">

                        <h3>${product.name}</h3>

                        <div class="price">
                            ₹${product.price}
                        </div>

                        <button onclick="addToCart(${index})">
                            🛒 Add to Cart
                        </button>

                        <button class="remove-btn"
                                onclick="removeWishlist(${index})">
                            Remove
                        </button>

                    </div>
                `;

            });

        }

        function removeWishlist(index) {

            wishlist.splice(index, 1);

            localStorage.setItem(
                "wishlist",
                JSON.stringify(wishlist)
            );

            location.reload();
        }

        function addToCart(index) {

            let product = wishlist[index];

            product.quantity = 1;

            localStorage.setItem(
                "cartProduct",
                JSON.stringify(product)
            );

            window.location.href = "cart.html";
        }

    </script>

</body>
</html>
