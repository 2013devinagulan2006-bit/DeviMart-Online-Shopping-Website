<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Devi Mart - Login</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    }

    .login-container {
        width: 400px;
        background: white;
        padding: 40px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .logo {
        text-align: center;
        font-size: 34px;
        font-weight: bold;
        color: #e91e63;
        margin-bottom: 8px;
    }

    .welcome {
        text-align: center;
        font-size: 20px;
        color: #444;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #888;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    input:focus {
        border-color: #e91e63;
    }

    .login-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #e91e63;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-btn:hover {
        background: #c2185b;
    }

    .forgot {
        text-align: right;
        margin-top: 10px;
    }

    .forgot a {
        color: #e91e63;
        text-decoration: none;
        font-size: 13px;
    }

    .divider {
        display: flex;
        align-items: center;
        margin: 25px 0;
    }

    .divider::before,
    .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #ddd;
    }

    .divider span {
        margin: 0 10px;
        color: #999;
        font-size: 13px;
    }

    .create-text {
        text-align: center;
        color: #555;
        font-size: 14px;
    }

    .create-btn {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: 2px solid #e91e63;
        border-radius: 8px;
        background: white;
        color: #e91e63;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .create-btn:hover {
        background: #fff0f6;
    }

    .footer {
        text-align: center;
        margin-top: 25px;
        font-size: 12px;
        color: #999;
    }
</style>

</head><body><div class="login-container"><div class="logo">Devi Mart</div>

<div class="welcome">Welcome to Devi Mart</div>

<div class="subtitle">
    One Mart. Everything You Need.
</div>

<form id="loginForm">

    <div class="form-group">
        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
    </div>

    <div class="form-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >
    </div>

    <button type="submit" class="login-btn">
        Login
    </button>

</form>

<div class="forgot">
    <a href="#" onclick="forgotPassword()">Forgot Password?</a>
</div>

<div class="divider">
    <span>OR</span>
</div>

<div class="create-text">
    Don't have an account?
</div>

<button
    class="create-btn"
    onclick="window.location.href='register.html'">
    Create Account
</button>

<div class="footer">
    © 2026 Devi Mart. All Rights Reserved.
</div>

</div><script>

    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const users = JSON.parse(localStorage.getItem("users")) || [];

        const user = users.find(function(account) {
            return account.email === email && account.password === password;
        });

        if (!user) {

            alert("Invalid email or password.");
            return;

        }

        localStorage.setItem("loggedInUser", JSON.stringify(user));

        alert("Login successful!");

        if (user.accountType === "buyer") {

            window.location.href = "home.html";

        } else if (user.accountType === "seller") {

            window.location.href = "seller.html";

        } else if (user.accountType === "admin") {

            window.location.href = "admin.html";

        } else {

            alert("Account type not found. Please register again.");

        }

    });


    function forgotPassword() {

        alert("Forgot Password feature will be connected to the backend later.");

    }

</script></body>
</html>
