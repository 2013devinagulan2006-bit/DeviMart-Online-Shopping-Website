<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devi Mart - Seller</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        nav {
            background: linear-gradient(135deg, #ff4f9a, #ff1493);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-btn {
            background: #222;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .welcome h1 {
            color: #ff1493;
            margin-bottom: 8px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .dashboard-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .dashboard-card h2 {
            color: #ff1493;
            margin-bottom: 8px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-header h2 {
            color: #222;
        }

        .add-btn {
            background: #ff1493;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #d90072;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-row {
            background: white;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 75px;
            height: 75px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
            flex-shrink: 0;
        }

        .product-details {
            flex: 1;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .product-category {
            color: #777;
            font-size: 14px;
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .product-price {
            color: #e91e63;
            font-size: 17px;
            font-weight: bold;
        }

        .edit-area {
            display: none;
            flex: 1;
            gap: 8px;
            flex-wrap: wrap;
        }

        .edit-area input,
        .edit-area select {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .name-input {
            min-width: 180px;
        }

        .price-input {
            width: 100px;
        }

        .category-input {
            width: 130px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions button {
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        .edit-btn {
            background: #2196f3;
            color: white;
        }

        .save-btn {
            background: #4caf50;
            color: white;
            display: none;
        }

        .delete-btn {
            background: #f44336;
            color: white;
        }

        .edit-btn:hover {
            background: #1976d2;
        }

        .save-btn:hover {
            background: #388e3c;
        }

        .delete-btn:hover {
            background: #d32f2f;
        }

        .orders-section {
            margin-top: 45px;
        }

        .orders {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .order-id {
            color: #ff1493;
            font-weight: bold;
        }

        .status {
            background: #fff3cd;
            color: #856404;
            padding: 6px 12px;
            border-radius: 15px;
            font-weight: bold;
        }

        .order-details p {
            margin: 6px 0;
        }

        .order-amount {
            color: #e91e63;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            background: #222;
            color: white;
            text-align: center;
        }

        @media (max-width: 700px) {
            nav {
                padding: 15px 20px;
            }

            .logo {
                font-size: 22px;
            }

            .product-row {
                flex-wrap: wrap;
            }

            .product-details {
                min-width: 150px;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }

            .edit-area {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">
        Devi Mart - Seller
    </div>

    <div class="nav-right">
        <a href="home.html">Home</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>


<div class="container">

    <div class="welcome">
        <h1>Welcome, Seller!</h1>
        <p>Manage your products and customer orders here.</p>
    </div>


    <div class="dashboard">

        <div class="dashboard-card">
            <h2 id="productCount">0</h2>
            <p>Total Products</p>
        </div>

        <div class="dashboard-card">
            <h2 id="orderCount">0</h2>
            <p>Total Orders</p>
        </div>

        <div class="dashboard-card">
            <h2 id="pendingCount">0</h2>
            <p>Pending Orders</p>
        </div>

    </div>


    <div class="section-header">

        <h2>📦 My Products</h2>

        <button class="add-btn" onclick="addProduct()">
            + Add Product
        </button>

    </div>


    <div class="product-list" id="productList"></div>


    <div class="orders-section">

        <div class="section-header">
            <h2>🛒 Customer Orders</h2>
        </div>

        <div class="orders" id="orderList"></div>

    </div>

</div>


<footer>
    <p>© 2026 Devi Mart. All Rights Reserved.</p>
</footer>


<script>

const loggedInUser =
    JSON.parse(localStorage.getItem("loggedInUser"));


if (!loggedInUser || loggedInUser.accountType !== "seller") {

    alert("Seller access required.");

    window.location.href = "login.html";
}


let products =
    JSON.parse(localStorage.getItem("products")) || [];


let orders =
    JSON.parse(localStorage.getItem("orders")) || [];


function saveProducts() {

    localStorage.setItem(
        "products",
        JSON.stringify(products)
    );

}


function displayProducts() {

    const productList =
        document.getElementById("productList");

    productList.innerHTML = "";


    document.getElementById("productCount").textContent =
        products.length;


    if (products.length === 0) {

        productList.innerHTML = `
            <div class="empty">
                <h2>No products available</h2>
                <p>Click "+ Add Product" to add a product.</p>
            </div>
        `;

        return;
    }


    products.forEach(function(product, index) {

        const row =
            document.createElement("div");

        row.className = "product-row";


        row.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
            >


            <div class="product-details" id="details-${index}">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-category">
                    Category: ${product.category}
                </div>

                <div class="product-price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                </div>

            </div>


            <div class="edit-area" id="edit-${index}">

                <input
                    class="name-input"
                    id="name-${index}"
                    value="${product.name}"
                >

                <input
                    class="price-input"
                    id="price-${index}"
                    type="number"
                    value="${product.price}"
                >

                <input
                    class="category-input"
                    id="category-${index}"
                    value="${product.category}"
                >

            </div>


            <div class="actions">

                <button
                    class="edit-btn"
                    id="editBtn-${index}"
                    onclick="editProduct(${index})"
                >
                    Edit
                </button>

                <button
                    class="save-btn"
                    id="saveBtn-${index}"
                    onclick="saveProduct(${index})"
                >
                    Save
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteProduct(${index})"
                >
                    Delete
                </button>

            </div>

        `;


        productList.appendChild(row);

    });

}


function editProduct(index) {

    document.getElementById(
        "details-" + index
    ).style.display = "none";


    document.getElementById(
        "edit-" + index
    ).style.display = "flex";


    document.getElementById(
        "editBtn-" + index
    ).style.display = "none";


    document.getElementById(
        "saveBtn-" + index
    ).style.display = "block";

}


function saveProduct(index) {

    const name =
        document.getElementById(
            "name-" + index
        ).value.trim();


    const price =
        document.getElementById(
            "price-" + index
        ).value;


    const category =
        document.getElementById(
            "category-" + index
        ).value.trim();


    if (!name || !price || !category) {

        alert("Please fill all product details.");

        return;
    }


    products[index].name = name;

    products[index].price = Number(price);

    products[index].category =
        category.toLowerCase();


    saveProducts();

    displayProducts();

    alert("Product updated successfully!");

}


function deleteProduct(index) {

    const product =
        products[index];


    const confirmDelete =
        confirm(
            "Delete " + product.name + "?"
        );


    if (!confirmDelete) {
        return;
    }


    products.splice(index, 1);

    saveProducts();

    displayProducts();

    alert("Product deleted successfully!");

}


function addProduct() {

    const name =
        prompt("Enter product name:");

    if (!name) {
        return;
    }


    const price =
        prompt("Enter product price:");

    if (!price) {
        return;
    }


    const category =
        prompt(
            "Enter category: chocolates, electronics or flowers"
        );

    if (!category) {
        return;
    }


    const image =
        prompt("Enter product image URL:");

    if (!image) {
        return;
    }


    const newProduct = {

        name: name,

        price: Number(price),

        category: category.toLowerCase(),

        image: image

    };


    products.push(newProduct);

    saveProducts();

    displayProducts();

    alert("Product added successfully!");

}


function displayOrders() {

    const orderList =
        document.getElementById("orderList");


    orderList.innerHTML = "";


    document.getElementById("orderCount").textContent =
        orders.length;


    const pendingOrders =
        orders.filter(function(order) {

            return order.status === "Pending";

        });


    document.getElementById("pendingCount").textContent =
        pendingOrders.length;


    if (orders.length === 0) {

        orderList.innerHTML = `
            <div class="empty">
                <h2>No Orders Yet</h2>
                <p>Customer orders will appear here.</p>
            </div>
        `;

        return;
    }


    orders.forEach(function(order) {

        const card =
            document.createElement("div");

        card.className = "order-card";


        card.innerHTML = `

            <div class="order-top">

                <div class="order-id">
                    ${order.orderId}
                </div>

                <div class="status">
                    ${order.status}
                </div>

            </div>


            <div class="order-details">

                <p>
                    <strong>Product:</strong>
                    ${order.product.name}
                </p>

                <p>
                    <strong>Quantity:</strong>
                    ${order.product.quantity}
                </p>

                <p>
                    <strong>Customer:</strong>
                    ${order.customerName}
                </p>

                <p>
                    <strong>Email:</strong>
                    ${order.customerEmail || "Not available"}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${order.phone}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${order.address}
                </p>

                <p>
                    <strong>Payment:</strong>
                    ${order.paymentMethod}
                </p>

                <p>
                    <strong>Order Date:</strong>
                    ${order.orderDate}
                </p>

                <div class="order-amount">
                    Total: ₹${Number(order.totalAmount).toLocaleString("en-IN")}
                </div>

            </div>

        `;


        orderList.appendChild(card);

    });

}


function logout() {

    localStorage.removeItem("loggedInUser");

    window.location.href = "login.html";

}


displayProducts();

displayOrders();

</script>

</body>
</html>
