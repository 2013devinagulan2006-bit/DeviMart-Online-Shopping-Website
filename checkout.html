<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devi Mart - Checkout</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f5f5;
    }

    nav {
        background: linear-gradient(135deg, #ff4f9a, #ff1493);
        padding: 18px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        color: white;
        font-size: 28px;
        font-weight: bold;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        margin-left: 20px;
    }

    .container {
        width: 90%;
        max-width: 1000px;
        margin: 35px auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .checkout-box {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        margin-bottom: 25px;
    }

    .checkout-box h2 {
        color: #ff1493;
        margin-bottom: 20px;
    }

    .product {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .product img {
        width: 120px;
        height: 120px;
        object-fit: contain;
        border-radius: 10px;
    }

    .product-info h3 {
        margin-bottom: 10px;
    }

    .product-info p {
        margin: 6px 0;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 7px;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
    }

    textarea {
        height: 100px;
        resize: none;
    }

    .total {
        text-align: right;
        font-size: 22px;
        font-weight: bold;
        color: #e91e63;
        margin-top: 20px;
    }

    .place-order {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        border: none;
        border-radius: 8px;
        background: #ff1493;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    .place-order:hover {
        background: #d90072;
    }

    footer {
        margin-top: 50px;
        padding: 25px;
        background: #222;
        color: white;
        text-align: center;
    }

    @media (max-width: 600px) {
        nav {
            padding: 15px 20px;
        }

        .product {
            flex-direction: column;
            align-items: flex-start;
        }

        .nav-links a {
            margin-left: 10px;
        }
    }
</style>

</head><body><nav><div class="logo">
    Devi Mart
</div>

<div class="nav-links">
    <a href="home.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart 🛒</a>
</div>

</nav><div class="container"><h1>Checkout</h1>

<div class="checkout-box">

    <h2>🛒 Order Summary</h2>

    <div class="product">

        <img id="productImage" src="" alt="Product">

        <div class="product-info">

            <h3 id="productName"></h3>

            <p>
                Price: ₹<span id="productPrice"></span>
            </p>

            <p>
                Quantity: <span id="productQuantity"></span>
            </p>

            <p>
                Subtotal: ₹<span id="subtotal"></span>
            </p>

        </div>

    </div>

    <div class="total">
        Total: ₹<span id="total"></span>
    </div>

</div>


<div class="checkout-box">

    <h2>📦 Delivery Details</h2>

    <label>Full Name</label>

    <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
    >

    <label>Phone Number</label>

    <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
    >

    <label>Delivery Address</label>

    <textarea
        id="address"
        placeholder="Enter your complete delivery address"
    ></textarea>

</div>


<div class="checkout-box">

    <h2>💳 Payment Method</h2>

    <label>Choose Payment Method</label>

    <select id="payment">

        <option value="">
            Select Payment Method
        </option>

        <option value="Cash on Delivery">
            Cash on Delivery
        </option>

        <option value="UPI">
            UPI
        </option>

        <option value="Card">
            Credit / Debit Card
        </option>

    </select>

    <button
        class="place-order"
        onclick="placeOrder()"
    >
        Place Order
    </button>

</div>

</div><footer><p>
    © 2026 Devi Mart. All Rights Reserved.
</p>

</footer><script>

const cartProduct = JSON.parse(
    localStorage.getItem("cartProduct")
);


const loggedInUser = JSON.parse(
    localStorage.getItem("loggedInUser")
);


if (!cartProduct) {

    alert("Your cart is empty!");

    window.location.href = "cart.html";

} else {

    document.getElementById("productImage").src =
        cartProduct.image;

    document.getElementById("productName").textContent =
        cartProduct.name;

    document.getElementById("productPrice").textContent =
        cartProduct.price.toLocaleString("en-IN");

    document.getElementById("productQuantity").textContent =
        cartProduct.quantity;

    const subtotal =
        cartProduct.price * cartProduct.quantity;

    document.getElementById("subtotal").textContent =
        subtotal.toLocaleString("en-IN");

    document.getElementById("total").textContent =
        subtotal.toLocaleString("en-IN");
}


function placeOrder() {

    const fullName =
        document.getElementById("fullName").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const payment =
        document.getElementById("payment").value;


    if (
        fullName === "" ||
        phone === "" ||
        address === "" ||
        payment === ""
    ) {

        alert("Please fill all the details!");

        return;
    }


    const subtotal =
        cartProduct.price * cartProduct.quantity;


    const order = {

        orderId:
            "ORD" + Date.now(),

        product: cartProduct,

        customerName: fullName,

        customerEmail:
            loggedInUser ? loggedInUser.email : "",

        phone: phone,

        address: address,

        paymentMethod: payment,

        totalAmount: subtotal,

        status: "Pending",

        orderDate:
            new Date().toLocaleString()

    };


    let orders =
        JSON.parse(localStorage.getItem("orders")) || [];


    orders.push(order);


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    localStorage.setItem(
        "order",
        JSON.stringify(order)
    );


    localStorage.removeItem("cartProduct");


    window.location.href =
        "order-success.html";

}

</script></body>
</html>
